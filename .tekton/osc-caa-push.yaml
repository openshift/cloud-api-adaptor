apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/cloud-api-adaptor?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" &&
      target_branch == "osc-release-v1.14" &&
      (
        "src/***".pathChanged() ||
        ".tekton/osc-caa-push.yaml".pathChanged()
      )
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: openshift-sandboxed-containers-v1-14
    appstudio.openshift.io/component: osc-caa-v1-14
    pipelines.appstudio.openshift.io/type: build
  name: osc-caa-v1-14-on-push
  namespace: ose-osc-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ose-osc-tenant/osc-caa-v1-14:{{revision}}
  - name: dockerfile
    value: cloud-api-adaptor/Dockerfile.openshift
  - name: path-context
    value: src
  - name: prefetch-input
    value: '[{"type": "rpm", "path": "./src/cloud-api-adaptor/"}, {"type": "gomod", "path": "./src/cloud-api-adaptor"}]'
  - name: build-args-file
    value: '.tekton/caa-build-args.env'
  pipelineRef:
    resolver: git
    params:
      - name: org
        value: redhat
      - name: scmType
        value: github
      - name: serverURL
        value: https://github.com
      - name: url
        value: "https://github.com/openshift/sandboxed-containers-operator.git"
      - name: revision
        value: osc-release-v1.14
      - name: pathInRepo
        value: ".tekton/build-pipeline.yaml"
  taskRunTemplate:
    serviceAccountName: build-pipeline-osc-caa-v1-14
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
